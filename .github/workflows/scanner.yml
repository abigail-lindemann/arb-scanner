name: scanner

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit data.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
        run: |
          python -m src.scanner_run
          python -m src.analytics.track_record

      - name: Commit dashboard data
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/data.json docs/track-record.json
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data: scanner update [skip ci]"
            git push
          fi
