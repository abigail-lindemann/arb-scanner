name: briefing

on:
  schedule:
    - cron: "0 13 * * *"   # ~08:00 America/Chicago (CDT); DST handled in code
    - cron: "0 1 * * *"    # ~20:00 America/Chicago (CDT); DST handled in code
  workflow_dispatch: {}

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send briefing (only if within the local window — H6)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
        run: python -m src.briefing_run
